# ============================================
# CINESMART DOCKER COMPOSE
# Cloud Deployment Configuration
# ============================================

version: '3.8'

services:
  # Backend API with AI/ML
  cinesmart-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cinesmart-backend
    ports:
      - "9090:9090"
    environment:
      - SPRING_PROFILES_ACTIVE=cloud
      - PORT=9090
    networks:
      - cinesmart-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Static Server (Nginx)
  cinesmart-frontend:
    image: nginx:alpine
    container_name: cinesmart-frontend
    ports:
      - "80:80"
    volumes:
      - ./Frontend:/usr/share/nginx/html:ro
    networks:
      - cinesmart-network
    restart: unless-stopped

networks:
  cinesmart-network:
    driver: bridge

# ============================================
# To deploy to cloud:
# 1. Push code to GitHub
# 2. Connect to Render.com or Railway.app
# 3. Deploy using render.yaml or railway.json
# ============================================
